on:
  push:
    branches:
      - main
    paths:
      - 'tokens/**.json'
      - 'config.js'
      - 'package.json'

  pull_request:
    branches:
      - main
    paths:
      - 'tokens/**.json'
      - 'config.js'

jobs:
  build-tokens:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          
      - name: Install dependencies
        run: npm ci
        
      - name: Build tokens
        run: npm run build-tokens
        
      - name: Verify generated tokens are committed
        run: git diff --exit-code -- src/theme/tokens.ts
