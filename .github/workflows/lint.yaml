name: Lint

on:
  pull_request:
    branches:
      - master
      - feature/**
      - bugFix/**
      - development

  push:
    branches:
      - master
      - feature/**
      - bugFix/**
      - development

jobs:
  lint:
    runs-on: ubuntu-latest

    strategy:
      matrix:
        node-version: [20.x]

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm

      - name: Install Dependencies
        run: npm install --legacy-peer-deps

      - name: Run Tests
        run: npm run test

      - name: Run ESLint
        run: npm run lint
