name: CI - Lint & Test

on:
  pull_request:
    branches:
      - master
      - development
      - feature/*
      - bugFix/*
      - hotFix/*

  push:
    branches:
      - master
      - development
      - release/*

jobs:
  lint:
    runs-on: ubuntu-latest

    strategy:
      matrix:
        node-version: [20.x]

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node & Dependencies
        uses: ./.github/actions/setup-node-deps

      - name: Run Tests
        run: npm run test

      - name: Run ESLint
        run: npm run lint
