name: Release - Update Changelog

on:
  pull_request:
    types:
      - closed
    branches:
      - master

permissions:
  contents: write

concurrency:
  group: update-changelog-master
  cancel-in-progress: false

jobs:
  update-changelog:
    if: github.event.pull_request.merged == true && startsWith(github.event.pull_request.head.ref, 'release/')
    runs-on: ubuntu-latest

    steps:
      - name: Check out master
        uses: actions/checkout@v4
        with:
          ref: master
          fetch-depth: 0


      - name: Setup Node & Dependencies
        uses: ./.github/actions/setup-node-deps

      - name: Install changelog generator
        run: npm install --global generate-changelog

      - name: Generate changelog
        run: generate-changelog

      - name: Commit changelog
        run: |
          if git diff --quiet -- CHANGELOG.md && git diff --cached --quiet -- CHANGELOG.md && git ls-files --error-unmatch CHANGELOG.md >/dev/null 2>&1; then
            echo "CHANGELOG.md is unchanged."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add CHANGELOG.md
          git commit -m "docs: update changelog"
          git push origin HEAD:master
