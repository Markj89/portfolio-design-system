name: Build

on:
  push:
    branches:
      - master
      - feature/**"
      - bugFix/**
      - development
  pull_request:
    branches:
      - master
      - feature/**
      - bugFix/**
      - development

jobs:
  build:
    runs-on: ubuntu-latest

    strategy:
      matrix:
        node-version: [20.x]

    steps:
      - uses: actions/checkout@v4

      - name: Use Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node-version }}

      - name: Build
        run: |
          npm install --legacy-peer-deps
          npm run build-storybook
