name: Build Storybook

on:
  push:
    branches:
      - master
      - development
  pull_request:
    branches:
      - master
      - development

jobs:
  build-storybook:
    runs-on: ubuntu-latest

    strategy:
      matrix:
        node-version: [20.x]

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v7
          
      - name: Install Dependencies
        uses: ./.github/actions/setup-node-deps

      - name: Build Storybook
        run: npm run build-storybook
