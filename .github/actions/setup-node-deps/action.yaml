name: Setup Node and Dependencies
description: Set up Node.js 20 with caching and install dependencies

runs:
  using: composite
  steps:
    - name: Setup Node.js
      uses: actions/setup-node@v4
      with: 
        node-version: 20.x
        cache: npm

    - name: Install Dependencies
      shell: bash
      run: npm install --legacy-peer-deps